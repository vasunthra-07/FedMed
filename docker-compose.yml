# =============================================================================
# docker-compose.yml  —  FedMed Full System
# =============================================================================
# Spins up the entire federated system locally:
#   • fedmed-server   — Flower aggregation server (port 8080)
#   • hospital-alpha  — Client 0 (Pneumonia specialist)
#   • hospital-beta   — Client 1 (Cardiology specialist)
#   • hospital-gamma  — Client 2 (Pulmonology specialist)
#   • dashboard       — Streamlit Mission Control (port 8501)
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose logs -f server      # tail server logs
#   docker compose down -v             # stop + remove volumes
#
# Environment file (.env):
#   Create a .env file in the same directory with secrets:
#     FEDMED_JWT_SECRET=your-long-random-secret
#     FEDMED_DASH_PASS_HASH=$2b$12$...   (bcrypt hash of your password)
# =============================================================================

version: "3.9"

# ── Shared configuration ───────────────────────────────────────────────────────
x-fedmed-env: &fedmed-env
  FEDMED_SERVER_HOST: "0.0.0.0"
  FEDMED_SERVER_PORT: "8080"
  FEDMED_NUM_ROUNDS:  "10"
  FEDMED_MIN_CLIENTS: "2"
  FEDMED_USE_TLS:     "true"
  FEDMED_LOG_LEVEL:   "INFO"
  FEDMED_NUM_WORKERS: "4"
  FEDMED_STATE_DIR:   "/app/state"

x-client-common: &client-common
  build:    .
  image:    fedmed:latest
  restart:  on-failure
  depends_on:
    fedmed-server:
      condition: service_healthy
  environment:
    <<: *fedmed-env
  volumes:
    - certs:/app/certs:ro
    - logs:/app/logs
  networks:
    - fedmed-net

services:

  # ── Flower aggregation server ────────────────────────────────────────────────
  fedmed-server:
    build: .
    image: fedmed:latest
    container_name: fedmed-server
    command: python server.py
    ports:
      - "8080:8080"
    environment:
      <<: *fedmed-env
      FEDMED_RESUME:                "false"
      FEDMED_CHECKPOINT_EVERY:      "1"
      FEDMED_KEEP_CHECKPOINTS:      "5"
      FEDMED_JWT_SECRET:            "${FEDMED_JWT_SECRET:?FEDMED_JWT_SECRET is required}"
    volumes:
      - certs:/app/certs
      - checkpoints:/app/checkpoints
      - logs:/app/logs
      - state:/app/state
    networks:
      - fedmed-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()"]
      interval: 10s
      timeout:  5s
      retries:  12
      start_period: 20s

  # ── Hospital Alpha ─────────────────────────────────────────────────────────
  hospital-alpha:
    <<: *client-common
    container_name: hospital-alpha
    command: python client.py --id=0 --server=fedmed-server:8080
    environment:
      <<: *fedmed-env
      FEDMED_SAMPLES_PER_CLIENT: "2000"
      FEDMED_BIAS_FRACTION:      "0.75"

  # ── Hospital Beta ──────────────────────────────────────────────────────────
  hospital-beta:
    <<: *client-common
    container_name: hospital-beta
    command: python client.py --id=1 --server=fedmed-server:8080
    environment:
      <<: *fedmed-env
      FEDMED_SAMPLES_PER_CLIENT: "2000"
      FEDMED_BIAS_FRACTION:      "0.75"

  # ── Hospital Gamma ─────────────────────────────────────────────────────────
  hospital-gamma:
    <<: *client-common
    container_name: hospital-gamma
    command: python client.py --id=2 --server=fedmed-server:8080
    environment:
      <<: *fedmed-env
      FEDMED_SAMPLES_PER_CLIENT: "2000"
      FEDMED_BIAS_FRACTION:      "0.75"

  # ── Streamlit dashboard ────────────────────────────────────────────────────
  dashboard:
    build: .
    image: fedmed:latest
    container_name: fedmed-dashboard
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      <<: *fedmed-env
      FEDMED_DASH_USER:      "${FEDMED_DASH_USER:-admin}"
      FEDMED_DASH_PASS_HASH: "${FEDMED_DASH_PASS_HASH:?FEDMED_DASH_PASS_HASH is required}"
      FEDMED_JWT_SECRET:     "${FEDMED_JWT_SECRET:?FEDMED_JWT_SECRET is required}"
    volumes:
      - state:/app/state:ro
      - checkpoints:/app/checkpoints:ro
      - logs:/app/logs:ro
    networks:
      - fedmed-net
    depends_on:
      - fedmed-server
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 30s


# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  certs:        # TLS certificates (generated on first start)
  checkpoints:  # Global model checkpoints
  logs:         # Structured JSON logs
  state:        # metrics.csv + telemetry.jsonl + status.json


# ── Network ───────────────────────────────────────────────────────────────────
networks:
  fedmed-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
