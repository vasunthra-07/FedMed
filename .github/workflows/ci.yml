name: FedMed CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  FEDMED_JWT_SECRET: "ci-test-secret-00000000000000000000000000000000"
  FEDMED_DASH_PASS_HASH: "$2b$12$PawPhAVduh5Vh8pIi9mo.en8Mp0IUeSjd5LXpMTyYi2KC1p7Per42"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format . --check

      - name: Run tests
        run: pytest . --cov=. --cov-report=term-missing --tb=short -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fedmed:${{ github.sha }},fedmed:latest
