# =============================================================================
# .github/workflows/ci.yml  —  FedMed CI Pipeline
# =============================================================================
# Triggers: push to any branch, pull requests to main
#
# Jobs:
#   1. lint        — ruff check + format check (fast, <30s)
#   2. type-check  — mypy static analysis
#   3. test        — pytest with coverage report
#   4. docker      — build Docker image (on main branch only)
# =============================================================================

name: FedMed CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Prevent torch from downloading CUDA — CPU only in CI
  TORCH_DEVICE: "cpu"


jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Ruff lint check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format . --check


  # ── Job 2: Type checking ─────────────────────────────────────────────────────
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          # Install lightweight subset — mypy doesn't need to run the model
          pip install mypy torch torchvision numpy pandas plotly streamlit

      - name: mypy
        run: mypy common.py config.py security.py checkpoint.py logger.py --ignore-missing-imports


  # ── Job 3: Tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -v \
            -m "not slow and not gpu"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ !cancelled() }}
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI if Codecov is unreachable

      - name: Enforce minimum coverage
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          rate = float(tree.getroot().attrib['line-rate'])
          pct  = rate * 100
          print(f'Coverage: {pct:.1f}%')
          if pct < 60:
              raise SystemExit(f'Coverage {pct:.1f}% is below 60% threshold')
          "


  # ── Job 4: Docker build ──────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false   # set to true + add registry login to deploy
          tags: fedmed:${{ github.sha }},fedmed:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm fedmed:${{ github.sha }} \
            python -c "from common import MedXRayCNN; m=MedXRayCNN(); print('Model OK:', sum(p.numel() for p in m.parameters()), 'params')"
